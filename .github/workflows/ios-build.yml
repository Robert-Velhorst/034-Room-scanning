name: iOS build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Verify final Xcode and hash-pinned XcodeGen
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/prepare-ios-toolchain.py
      - name: Generate iOS project
        run: xcodegen generate --spec ios/RoomScanning/project.yml
      - name: Verify generated target SDK and Swift language mode
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/prepare-ios-toolchain.py --build-settings
      - name: Build Swift 6 simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/RoomScanning/RoomScanning.xcodeproj \
            -scheme RoomScanning \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/RoomScanningDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/room-scanning-build.log"
      - name: Retain actual toolchain and native build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-scanning-ios-qualification
          path: |
            ${{ runner.temp }}/room-scanning-toolchain.json
            ${{ runner.temp }}/room-scanning-build-settings.json
            ${{ runner.temp }}/room-scanning-build.log
          retention-days: 14
          if-no-files-found: warn
